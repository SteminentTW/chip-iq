# 每個交易日盤後自動更新資料並重新發佈。
#
# 為什麼可以跑在 GitHub Actions：本站所有資料源都是公開 API，沒有任何憑證要保管。
# 也因此**不要**把需要帳密或內部資料的東西加進這個 workflow。
#
# 排程時間：兩個時段，都刻意避開整點與半點。
#   UTC 10:17 = 台北 18:17（TPEx 買賣日報表約 16:35 出檔，留 100 分鐘緩衝）
#   UTC 12:47 = 台北 20:47（第一次被延遲太久或遇到暫時性錯誤時的補跑）
# 為什麼要兩個：GitHub 免費排程的延遲遠比想像大。2026-07-27～09-09 共 33 次排程，
# 中位晚 2.1 小時、最近兩週固定晚 4.3 小時（21:45 才跑），最慘晚 11.5 小時（隔天凌晨）。
# 兩個時段各是獨立的一次機會；第二次若第一次已成功，抓到相同資料、只更新時間戳。
# 為什麼是 :17 和 :47：GitHub 文件明說整點是最壅塞的時刻，建議排在其他分鐘數。
#   UTC 22:00 = 隔天台北 06:00（補跑班）：前一晚兩班都沒更新才跑。判斷邏輯在 check job。
#   之所以要有這班：晚上兩班都可能被延遲到隔天凌晨或都撞到暫時性錯誤；
#   早上這班保證「上班前一定看得到昨天的資料」，而且昨晚已更新時完全不跑、不多打請求。
# 要更準時（例如一定要 18:00 前更新）只能靠外部觸發（見 README「排程」節）。
#
# ⚠️ repo 連續 60 天沒有活動時，GitHub 會自動停用排程工作流程。
#    機器人自己推的 commit 算不算活動並不明確，所以請每月看一眼網頁上的「最後更新」日期。

name: 每日資料更新

on:
  schedule:
    - cron: "18 10 * * 1-5"
    - cron: "47 12 * * 1-5"
    # 隔天台北 06:00。UTC 的週一～週五 = 台北週二～週六早上，正好接住週一～週五每個晚上
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # 也可以在 Actions 頁面手動觸發

permissions:
  contents: write

# 所有腳本的 date.today() 都以台北時間為準。runner 是 UTC，排程被延遲到台北午夜
# 之後時，UTC 日期會比台北慢一天，meta.updated_at 就會跟 commit 訊息對不上。
env:
  TZ: Asia/Taipei

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  # 早上補跑班先看昨晚有沒有更新過；有就讓整個 update job 不跑，
  # 不是跑完才發現沒差異——那樣還是白打一百多個請求給 TWSE／TPEx／Yahoo。
  # 判斷依據：HEAD 是不是機器人在 16 小時內推的「資料更新」commit。
  #   晚上任一班成功 → HEAD 是機器人、幾小時前 → 略過
  #   兩班都失敗     → HEAD 是前一天的機器人 commit（>16h）→ 跑
  #   昨晚有人推程式碼 → HEAD 是人 → 跑（多跑一次無害，沒差異就不 commit）
  #   國定假日       → 晚上沒東西可 commit → 早上跑一次、一樣沒差異；一年十幾次，可忽略
  # 晚上兩班與手動觸發不經這個判斷，一律直接跑。
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ "${{ github.event.schedule }}" != "0 22 * * 1-5" ]; then
            echo "不是早上補跑班，直接跑"; exit 0
          fi
          # 明確看 HEAD 的作者。不用 --author 過濾：那是「往回找第一個機器人 commit」，
          # 在 depth-1 checkout 剛好等於 HEAD，但誰改了 fetch-depth 就會默默變質。
          line=$(git log -1 --format='%ct|%an')
          ts=${line%%|*}; name=${line#*|}
          if [ "$name" != "chip-iq bot" ]; then echo "HEAD 是「$name」的 commit，不是機器人，跑"; exit 0; fi
          age=$(( ($(date +%s) - ts) / 3600 ))
          if [ "$age" -lt 16 ]; then
            echo "昨晚已更新（${age} 小時前），略過"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "最近一次更新是 ${age} 小時前，補跑"
          fi

  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # 腳本只用標準函式庫，不需要 pip install

      - name: 抓分點資料
        run: |
          python scripts/fetch_broker_lut.py
          python scripts/fetch_broker_daily.py --days 7

      - name: 抓價量與市值
        run: |
          python scripts/fetch_tpex.py
          python scripts/fetch_peers.py
          python scripts/fetch_universe.py

      # 海外授權夥伴（REPROCELL 4978.T／풍전약품 298060.KQ）。
      # 資料源是 Yahoo v8 chart —— 非官方端點，本 runner 的 IP 有可能被擋。
      # fetch_partners.py 抓不到時會沿用上一次的良好資料並在 meta 記錄原因，
      # 自身不會 exit 1，所以這一步不需要 continue-on-error；真的 crash 才該讓工作失敗。
      - name: 抓海外夥伴行情
        run: python scripts/fetch_partners.py

      # 對 2026-07-21 黃金樣本回歸測試。沒過就讓整個工作失敗、不要發佈 ——
      # 寧可網頁停在昨天的資料，也不要把錯的數字推上去。
      - name: 回歸測試（分點）
        run: python scripts/verify_broker.py

      # 夥伴面板同一套原則，但分兩級：資料「錯」才擋發佈（exit 1），
      # 資料「舊或缺」只警告（exit 0）—— 後者 JSON 裡有標記，前端會顯示
      # 「資料最後成功更新於 X」或「無資料」，不該讓整站停止更新。
      # --self-test 是突變測試，確保有人放寬檢查時會被發現。
      - name: 回歸測試（海外夥伴）
        run: |
          python scripts/verify_partners.py
          python scripts/verify_partners.py --self-test

      # 全站形狀與日期（quote／meta／universe／peers／broker）。分點與夥伴各有
      # 守門員，但其餘幾個檔以前沒有人在 commit 前看一眼——fetch_tpex 某月抓失敗
      # 會帶著缺口上線、peers 某檔序列為空會讓前端整頁 TypeError。
      - name: 回歸測試（全站結構）
        run: python scripts/verify_site.py

      - name: 提交更新
        run: |
          git config user.name "chip-iq bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cache
          if git diff --staged --quiet; then
            echo "資料無變化（可能是國定假日），不提交"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            # 跑到這裡通常已經 6～7 分鐘，期間若有人推了程式碼，直接 push 會被拒。
            # 機器人只改 data／cache、人只改程式碼，rebase 不會衝突。
            git pull --rebase origin main
            git push
          fi
